server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # clean URLs: /about -> /about/ -> about/index.html
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # never serve dotfiles (.htaccess etc.)
  location ~ /\. { deny all; }

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

  # hashed build files never change
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location ~* \.(?:html|txt|xml|webmanifest)$ {
    add_header Cache-Control "public, max-age=300";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
